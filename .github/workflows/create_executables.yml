name: Build Executables

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            archive: zip
            binary_name: grep-docx.exe
            archive_name: grep-docx-windows-x64
          - os: macos-latest
            archive: tar.gz
            binary_name: grep-docx
            archive_name: grep-docx-macos-arm64
          - os: ubuntu-latest
            archive: tar.gz
            binary_name: grep-docx
            archive_name: grep-docx-linux-x64
          - os: ubuntu-24.04-arm
            archive: tar.gz
            binary_name: grep-docx
            archive_name: grep-docx-linux-arm64
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install --upgrade pyinstaller

      - name: Build executable with PyInstaller
        run: |
          pyinstaller --noconfirm --onefile grep-docx.py

      - name: Set permissions and create archive (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          chmod 555 dist/${{ matrix.binary_name }}
          mkdir -p staging
          cp dist/${{ matrix.binary_name }} staging/${{ matrix.binary_name }}
          tar czf ${{ matrix.archive_name }}.tar.gz -C staging .

      - name: Set permissions and create archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path staging
          Copy-Item dist\${{ matrix.binary_name }} staging\${{ matrix.binary_name }}
          Compress-Archive -Path staging\* -DestinationPath ${{ matrix.archive_name }}.zip -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.archive_name }}
          path: ${{ matrix.archive_name }}.${{ matrix.archive }}

      - name: Upload to GitHub Release (tag push only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: gh release upload "${{ github.ref_name }}" "${{ matrix.archive_name }}.${{ matrix.archive }}" --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
